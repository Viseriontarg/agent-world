[package]
name = "agent-world"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
description = "Lean native command room for Codex and Claude"
authors = ["Aminreza Khoshbahar"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Viseriontarg/agent-world"
homepage = "https://github.com/Viseriontarg/agent-world"
keywords = ["agents", "codex", "claude", "egui", "orchestration"]
categories = ["development-tools", "gui"]
publish = false

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

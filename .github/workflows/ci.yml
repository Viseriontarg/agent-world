name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: build · lint · self-check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.95.0 (MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build release
        run: cargo build --release --locked

      # The provider probe test asserts against locally installed `codex` and
      # `claude` CLIs, which no hosted runner has. Everything else must pass.
      - name: Test
        run: cargo test --release --locked -- --skip installed_provider_surfaces_are_probeable_without_a_turn

      - name: Durable core, idempotency, and crash-recovery self-check
        run: .\target\release\agent-world.exe --self-check

      - name: Live lifecycle, crash-window, bounds, and stress evidence
        shell: pwsh
        run: |
          $json = (.\target\release\agent-world.exe --live-slice-self-check | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "live-slice self-check exited with $LASTEXITCODE"
          }
          $evidence = $json | ConvertFrom-Json
          if (-not $evidence.automated_checks_passed) {
            throw "deterministic live-slice checks did not pass"
          }
          if ($evidence.release_ready -or $evidence.passed -or $evidence.issue_acceptance_ready) {
            throw "fixture evidence must not claim release or issue acceptance readiness"
          }
          if ($evidence.external_blocker_count -ne 6) {
            throw "live-slice evidence must retain all six external blockers"
          }
          $json | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\live-slice-evidence.json"

      - name: Upload live-slice evidence
        uses: actions/upload-artifact@v7
        with:
          name: live-slice-evidence-windows
          path: ${{ runner.temp }}\live-slice-evidence.json
          if-no-files-found: error

      - name: Provider probe surface (zero model turns)
        run: .\target\release\agent-world.exe --probe-providers
        continue-on-error: true

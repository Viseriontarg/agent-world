name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: build · lint · self-check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      # The provider probe test asserts against locally installed `codex` and
      # `claude` CLIs, which no hosted runner has. Everything else must pass.
      - name: Test
        run: cargo test --release -- --skip installed_provider_surfaces_are_probeable_without_a_turn

      - name: Durable core, idempotency, and crash-recovery self-check
        run: .\target\release\agent-world.exe --self-check

      - name: Provider probe surface (zero model turns)
        run: .\target\release\agent-world.exe --probe-providers
        continue-on-error: true

name: Jayden OpenFOAM industrial dryer validation

on:
  push:
    branches:
      - jayden-openfoam-validation-20260903
    paths:
      - .github/workflows/jayden-openfoam-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4

      - name: Decode self-contained validation package
        shell: bash
        run: |
          rm -rf _jayden_payload
          mkdir -p _jayden_payload
          cat .github/jayden-openfoam-payload.part1.b64 .github/jayden-openfoam-payload.b64 \
            | base64 --decode > /tmp/jayden_payload.tar.gz
          echo "973e21c568f7461fe0f536554b633a96f5a8ed612e7a66eb347044b4361db4d2  /tmp/jayden_payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/jayden_payload.tar.gz -C _jayden_payload

      - name: Pull official OpenFOAM Foundation v11 container
        run: docker pull openfoam/openfoam11-paraview510

      - name: Restore matching source headers, build, and execute matrix
        shell: bash
        run: |
          docker run --rm --user 0:0 \
            --entrypoint /bin/bash \
            -v "$PWD/_jayden_payload:/work" \
            -w /work \
            openfoam/openfoam11-paraview510 \
            -lc '
              set -euo pipefail
              source /opt/openfoam11/etc/bashrc
              if [ ! -f /opt/openfoam11/src/finiteVolume/lnInclude/fvCFD.H ]; then
                rm -rf /tmp/OpenFOAM-11-src /tmp/of11
                mkdir -p /tmp/of11
                wget -qO /tmp/OpenFOAM-11.tgz http://dl.openfoam.org/source/11
                tar -xzf /tmp/OpenFOAM-11.tgz -C /tmp/of11
                SRC_DIR=$(find /tmp/of11 -mindepth 1 -maxdepth 1 -type d -name "OpenFOAM-11*")
                test -n "$SRC_DIR"
                rm -rf /opt/openfoam11/src
                cp -a "$SRC_DIR/src" /opt/openfoam11/src
                wmakeLnIncludeAll > /work/log.lninclude 2>&1
              fi
              test -f /opt/openfoam11/src/finiteVolume/lnInclude/fvCFD.H
              chmod +x scripts/run_all.sh
              scripts/run_all.sh
              printf "OpenFOAM Foundation %s (%s)\n" "$WM_PROJECT_VERSION" "$WM_PROJECT_DIR" > openfoam-version.txt
            '

      - name: Verify solver evidence exists
        shell: bash
        run: |
          test -s _jayden_payload/openfoam-version.txt
          test -s _jayden_payload/log.wmake
          test -s _jayden_payload/validation_summary.json
          for c in low central high central_ref; do
            test -s "_jayden_payload/runs/$c/log.blockMesh"
            test -s "_jayden_payload/runs/$c/log.checkMesh"
            test -s "_jayden_payload/runs/$c/log.jaydenDryerROMFoam"
            test -s "_jayden_payload/runs/$c/postProcessing/dryerMetrics/$c.csv"
          done

      - name: Collect evidence
        if: always()
        shell: bash
        run: |
          rm -rf _jayden_results
          mkdir -p _jayden_results/source _jayden_results/runs
          for f in openfoam-version.txt log.lninclude log.wmake validation_summary.json; do
            test -f "_jayden_payload/$f" && cp "_jayden_payload/$f" _jayden_results/ || true
          done
          for d in applications/jaydenDryerROMFoam case/constant case/system scripts; do
            if test -d "_jayden_payload/$d"; then
              mkdir -p "_jayden_results/source/$(dirname "$d")"
              cp -a "_jayden_payload/$d" "_jayden_results/source/$d"
            fi
          done
          for c in low central high central_ref; do
            mkdir -p "_jayden_results/runs/$c"
            if test -d "_jayden_payload/runs/$c"; then
              find "_jayden_payload/runs/$c" -maxdepth 1 -name 'log.*' -exec cp {} "_jayden_results/runs/$c/" \;
              test -d "_jayden_payload/runs/$c/postProcessing" && cp -a "_jayden_payload/runs/$c/postProcessing" "_jayden_results/runs/$c/" || true
            fi
          done
          find _jayden_results -type f -print0 | sort -z | xargs -0 sha256sum > _jayden_results/SHA256SUMS.txt

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jayden-openfoam-validation-results
          path: _jayden_results
          if-no-files-found: error
          retention-days: 7

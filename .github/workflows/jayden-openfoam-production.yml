name: Jayden OpenFOAM Production

on:
  push:
    branches:
      - jayden-openfoam-validation-20260903
    paths:
      - '.github/workflows/jayden-openfoam-production.yml'
      - 'scratch/fluid-bed-drying-validation/solver/dryingFoamV2/**'
      - 'scratch/fluid-bed-drying-validation/tools/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute complete validation pipeline
        id: pipeline
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE/scratch/fluid-bed-drying-validation"
          OUT="$ROOT/runtime-production"
          mkdir -p "$OUT/logs" "$ROOT/results"
          printf 'run_id=%s\nsha=%s\nref=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF_NAME" > "$OUT/run.txt"

          status=0
          {
            set -x
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends wget ca-certificates gnupg software-properties-common python3
            wget -qO- https://dl.openfoam.org/gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/openfoam.gpg >/dev/null
            echo 'deb [signed-by=/usr/share/keyrings/openfoam.gpg] http://dl.openfoam.org/ubuntu jammy main' | sudo tee /etc/apt/sources.list.d/openfoam.list
            sudo apt-get update
            if apt-cache show openfoam12 >/dev/null 2>&1; then
              sudo apt-get install -y openfoam12
              OF_BASHRC=/opt/openfoam12/etc/bashrc
            elif apt-cache show openfoam13 >/dev/null 2>&1; then
              sudo apt-get install -y openfoam13
              OF_BASHRC=/opt/openfoam13/etc/bashrc
            else
              exit 20
            fi
            echo "$OF_BASHRC" > "$OUT/bashrc-path.txt"
          } > "$OUT/logs/install.log" 2>&1
          rc=$?
          echo "$rc" > "$OUT/status.install"
          [ "$rc" -eq 0 ] || status="$rc"

          if [ "$status" -eq 0 ]; then
            cd "$ROOT"
            python3 tools/generate_cases.py > "$OUT/logs/generate.log" 2>&1
            rc=$?
          else
            rc=90
          fi
          echo "$rc" > "$OUT/status.generate"
          [ "$rc" -eq 0 ] || status="$rc"

          if [ "$status" -eq 0 ]; then
            # The gas field represents the already-developed hot-gas checkpoint.
            python3 - <<'PY' > "$OUT/logs/initialize-hot-gas.log" 2>&1
import json
import re
from pathlib import Path
root = Path(".")
for case_dir in (root / "cases").iterdir():
    if not case_dir.is_dir():
        continue
    meta = json.loads((case_dir / "case_metadata.json").read_text())
    path = case_dir / "0" / "Tgas"
    text = path.read_text()
    text = re.sub(
        r"internalField\s+uniform\s+[-+0-9.eE]+;",
        f"internalField uniform {meta['t_inlet']:.12g};",
        text,
        count=1,
    )
    path.write_text(text)
PY
            rc=$?
          else
            rc=91
          fi
          echo "$rc" > "$OUT/status.hot-gas-initialization"
          [ "$rc" -eq 0 ] || status="$rc"

          if [ "$status" -eq 0 ]; then
            source "$(cat "$OUT/bashrc-path.txt")"
            foamVersion > "$OUT/openfoam-version.txt" 2>&1
            cd "$ROOT/solver/dryingFoamV2"
            wmake > "$OUT/logs/wmake.log" 2>&1
            rc=$?
          else
            rc=92
          fi
          echo "$rc" > "$OUT/status.compile"
          [ "$rc" -eq 0 ] || status="$rc"

          CASES='smoke semolina industrial_low industrial_central industrial_high'
          if [ "$status" -eq 0 ]; then
            source "$(cat "$OUT/bashrc-path.txt")"
            for NAME in $CASES; do
              CASE="$ROOT/cases/$NAME"
              cd "$CASE"
              blockMesh > "$OUT/logs/$NAME.blockMesh.log" 2>&1 || { status=$?; break; }
              setFields > "$OUT/logs/$NAME.setFields.log" 2>&1 || { status=$?; break; }
              dryingFoam > "$OUT/logs/$NAME.dryingFoam.log" 2>&1 || { status=$?; break; }
              cp postProcessing/drying.csv "$OUT/$NAME.csv" || { status=$?; break; }
              cp case_metadata.json "$OUT/$NAME.metadata.json" || { status=$?; break; }
            done
          fi
          echo "$status" > "$OUT/status.solve"

          if [ "$status" -eq 0 ]; then
            cd "$ROOT"
            python3 tools/validate_results.py $CASES --output results > "$OUT/logs/validate.log" 2>&1
            rc=$?
          else
            rc=93
          fi
          echo "$rc" > "$OUT/status.validate"
          [ "$rc" -eq 0 ] || status="$rc"

          if [ "$status" -eq 0 ]; then
            cp results/summary.json "$OUT/summary.json"
            cp results/report.md "$OUT/report.md"
            tar -czf "$OUT/Jayden_OpenFOAM_runtime_bundle.tar.gz" \
              solver/dryingFoamV2 tools \
              cases/manifest.json \
              cases/smoke/0 cases/smoke/constant cases/smoke/system cases/smoke/case_metadata.json cases/smoke/postProcessing/drying.csv \
              cases/semolina/0 cases/semolina/constant cases/semolina/system cases/semolina/case_metadata.json cases/semolina/postProcessing/drying.csv \
              cases/industrial_low/0 cases/industrial_low/constant cases/industrial_low/system cases/industrial_low/case_metadata.json cases/industrial_low/postProcessing/drying.csv \
              cases/industrial_central/0 cases/industrial_central/constant cases/industrial_central/system cases/industrial_central/case_metadata.json cases/industrial_central/postProcessing/drying.csv \
              cases/industrial_high/0 cases/industrial_high/constant cases/industrial_high/system cases/industrial_high/case_metadata.json cases/industrial_high/postProcessing/drying.csv \
              results/summary.json results/report.md
            base64 "$OUT/Jayden_OpenFOAM_runtime_bundle.tar.gz" > "$OUT/Jayden_OpenFOAM_runtime_bundle.tar.gz.b64"
            rc=$?
          else
            rc=94
          fi
          echo "$rc" > "$OUT/status.bundle"
          [ "$rc" -eq 0 ] || status="$rc"
          echo "$status" > "$OUT/status.overall"
          exit "$status"

      - name: Upload all production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jayden-openfoam-production-${{ github.run_id }}
          path: |
            scratch/fluid-bed-drying-validation/runtime-production
            scratch/fluid-bed-drying-validation/results
          if-no-files-found: warn
          retention-days: 14

      - name: Commit production evidence to isolated branch
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/scratch/fluid-bed-drying-validation"
          git config user.name 'openfoam-validation-bot'
          git config user.email 'openfoam-validation-bot@users.noreply.github.com'
          git add -f "$ROOT/runtime-production" "$ROOT/results" || true
          git commit -m "cfd: record production OpenFOAM run $GITHUB_RUN_ID" || exit 0
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Enforce production gate
        if: always()
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE/scratch/fluid-bed-drying-validation"
          cat "$ROOT/runtime-production/status.overall"
          test "$(cat "$ROOT/runtime-production/status.overall")" = 0
